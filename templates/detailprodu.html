{% extends "base.html" %}

{% block title %}Detail Produk - TokoKita{% endblock %}

{% block content %}

<section class="py-5">
    <div class="container px-4 px-lg-5">

        <h1 class="fw-bolder mb-4">Detail Produk</h1>

        <div class="card shadow-sm">
            <div class="card-body">

                <h2>{{ item.nama|title }}</h2>

                <p>Kategori: {{ item.kategori }}</p>

                <h4 class="text-primary">
                    Rp{{ "{:,.0f}".format(item.harga) }}
                </h4>

                <p>{{ item.deskripsi }}</p>

                <a href="{{ url_for('produk') }}"
                   class="btn btn-secondary">
                    Kembali ke Produk
                </a>

            </div>
        </div>

    </div>
</section>

{% endblock %}
