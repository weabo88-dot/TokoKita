<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}TokoKita{% endblock %}</title>

    <link rel="icon" type="image/x-icon"
          href="{{ url_for('static', filename='assets/favicon.ico') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/styles.css') }}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container px-4 px-lg-5">

            <a class="navbar-brand" href="{{ url_for('beranda') }}">
                TokoKita
            </a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarToko">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarToko">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('beranda') }}">Beranda</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('tentang') }}">Tentang</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('produk') }}">Produk</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('pelanggan') }}">Pelanggan</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('registrasi') }}">Registrasi</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('kontak') }}">Kontak</a>
                    </li>

                </ul>
            </div>
        </div>
    </nav>


    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="py-4 bg-dark mt-5">
        <div class="container">
            <p class="m-0 text-center text-white">
                Copyright &copy; TokoKita 2026
            </p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>

</body>
</html>
