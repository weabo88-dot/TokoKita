{% extends "base.html" %}

{% block title %}Registrasi - TokoKita{% endblock %}

{% block content %}

<section class="py-5">
    <div class="container px-4 px-lg-5">

        <div class="row justify-content-center">
            <div class="col-md-6">

                <h1 class="fw-bolder mb-4">Pengecekan Username</h1>

                <p>
                    Masukkan username untuk memeriksa
                    apakah username masih tersedia.
                </p>

                <form action="{{ url_for('cek_query') }}"
                      method="GET"
                      id="form-registrasi">

                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Username
                        </label>

                        <input type="text"
                               class="form-control"
                               id="username"
                               name="u"
                               placeholder="Masukkan username">
                    </div>

                    <button type="submit" class="btn btn-dark">
                        Periksa Username
                    </button>

                </form>

            </div>
        </div>

    </div>
</section>

{% endblock %}
